# Sandbox the home directory for every test run started from the repo root (#242).
[test]
preload = ["./packages/cli/src/test-preload.ts"]
# Never collect compiled output or worktree copies (#964). A stale dist/ (128
# .test.js from a 14/10 build) hangs the whole suite under bun 1.3.14 — the
# compiled channel-wire-format gate spawns a POSIX sh shim unresolvable on
# win32 and initDone never resolves. Worktree copies fail the scratch-home
# preload and double-count every test. Glob is matched against the full path,
# so the pattern must be **/-anchored on both ends.
pathIgnorePatterns = ["**/dist/**", "**/worktrees/**"]
