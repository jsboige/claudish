# The preload scrubs claudish session-identity variables before any test file
# loads (scripts/test-preload.ts) and sandboxes the home directory for every test
# run (#242). bun reads bunfig.toml from the working directory only, so packages/cli
# (and macos-bridge) carry their own copy of these entries.
[test]
preload = ["./scripts/test-preload.ts", "./packages/cli/src/test-preload.ts"]
