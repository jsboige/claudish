name: Test

on:
  pull_request:
  push:
    branches: [main]
  # Baseline measurability: without a manual trigger, no run can exist on a
  # branch that receives no PRs (replatform/v14, a maintenance branch), so
  # "reduced against the baseline" had no commensurable number — only local
  # counters, which a Windows seat's CRLF checkout inflates by orders of
  # magnitude (#723 / DM 2026-10-27 23:30Z). Dispatch runs the workflow file
  # AS OF THE SELECTED REF, so a baseline run on X measures X's tree.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      # Pinned, unlike release.yml's `latest`: a CI result must be commensurable
      # with a seat (CLAUDE.md §Debugging & Tests — "a seat on an older bun is
      # not commensurable with CI"). Bump deliberately, never drift.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # Bun >= 1.4 on POSIX freezes os.homedir() at boot (a runtime HOME
      # assignment no longer moves it; the builtin namespace is readonly —
      # measured, see test-preload.ts). The home sandbox must therefore be
      # set by the LAUNCHER, before bun boots: preset HOME + the preload's
      # preset mode accept it as the sandbox (#570).
      # Gating since #921 grain 2: the two flake fixes (completedAt owned by
      # the exit event; per-file catalog warm reset) held 20/20 consecutive
      # green runs on the runner (PR #923 comment 6719044375), so the
      # non-gating era documented in #570 ends here.
      - name: Run test suite (packages/cli)
        env:
          CLAUDISH_TEST_PRESET_HOME: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/claudish-test-home"
          HOME="$RUNNER_TEMP/claudish-test-home" bun test --cwd packages/cli 2>&1 | tee test-output.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Suite summary
        if: always()
        run: |
          {
            echo "### Test suite (packages/cli, bun 1.4.0, ubuntu-latest)"
            echo "**Gating:** a failed suite fails the job (continue-on-error removed, #921 grain 2). The counts below are the suite's own summary."
            echo '```'
            grep -E '^ *[0-9]+ (pass|fail|skip)|^Ran [0-9]+ test' test-output.txt || echo "(no summary lines captured — see the test step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.txt
          retention-days: 14
