name: Test

on:
  pull_request:
  push:
    branches: [main]
  # Baseline measurability: without a manual trigger, no run can exist on a
  # branch that receives no PRs (replatform/v14, a maintenance branch), so
  # "reduced against the baseline" had no commensurable number — only local
  # counters, which a Windows seat's CRLF checkout inflates by orders of
  # magnitude (#723 / DM 2026-10-27 23:30Z). Dispatch runs the workflow file
  # AS OF THE SELECTED REF, so a baseline run on X measures X's tree.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      # Pinned, unlike release.yml's `latest`: a CI result must be commensurable
      # with a seat (CLAUDE.md §Debugging & Tests — "a seat on an older bun is
      # not commensurable with CI"). Bump deliberately, never drift.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # Bun >= 1.4 on POSIX freezes os.homedir() at boot (a runtime HOME
      # assignment no longer moves it; the builtin namespace is readonly —
      # measured, see test-preload.ts). The home sandbox must therefore be
      # set by the LAUNCHER, before bun boots: preset HOME + the preload's
      # preset mode accept it as the sandbox (#570).
      # Gating since #921 grain 2: the runner suite is green by the only
      # honest instrument — the fail counter of each attempt's job log, never
      # the conclusion badge (a "success" badge hid attempt 4 = 2980 pass /
      # 1 fail, measured 08/11). #923 (two flake fixes) held 19/20, the single
      # failure being the third flake itself; #928 root-caused that one
      # (keep-alive zombie socket, connection: close) and its head held
      # 20/20. The non-gating era of #570 ends here.
      - name: Run test suite (packages/cli)
        env:
          CLAUDISH_TEST_PRESET_HOME: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/claudish-test-home"
          HOME="$RUNNER_TEMP/claudish-test-home" bun test --cwd packages/cli 2>&1 | tee test-output.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Suite summary
        if: always()
        run: |
          {
            echo "### Test suite (packages/cli, bun 1.4.0, ubuntu-latest)"
            echo "**Gating:** a failed suite fails the job (continue-on-error removed, #921 grain 2). The counts below are the suite's own summary."
            echo '```'
            grep -E '^ *[0-9]+ (pass|fail|skip)|^Ran [0-9]+ test' test-output.txt || echo "(no summary lines captured — see the test step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.txt
          retention-days: 14

  # #956: typecheck gating from the first run (ACK c.6772628044 — no
  # continue-on-error: a red job must read red). Runs the SAME command the
  # seats run: the root `bun run typecheck`. Since #981 that command gates on
  # BOTH packages — the macos-bridge half was previously a silent no-op
  # (`bun --cwd X run typecheck`, usage dump exit 0 on bun >= 1.3) and is now
  # the working form `bun run --cwd packages/macos-bridge typecheck`; the
  # bridge's tsconfig was restructured (rootDir + cli reference removed) and
  # its real type errors fixed so the half actually runs green.
  typecheck:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0  # same pin as `test` — commensurable counts
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck (root script, gates on packages/cli + packages/macos-bridge)
        run: |
          bun run typecheck 2>&1 | tee typecheck-output.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Summary (total / sources / tests)
        if: always()
        run: |
          # grep -c exits 1 on zero matches — under bash -e that would turn a
          # GREEN run's summary red; || true keeps the count honest at 0.
          TOTAL=$(grep -cE 'error TS[0-9]+' typecheck-output.txt || true)
          TESTS=$(grep -E 'error TS[0-9]+' typecheck-output.txt | grep -cE '\.test\.ts\(|/test-support/' || true)
          SRC=$((TOTAL - TESTS))
          {
            echo "### Typecheck (tsc --noEmit, packages/cli + packages/macos-bridge, gating)"
            echo "| total | sources | tests |"
            echo "|---|---|---|"
            echo "| $TOTAL | $SRC | $TESTS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload typecheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output-${{ github.run_id }}
          path: typecheck-output.txt
          retention-days: 14

  # #1007: `scripts/tests/` is the repo's Python instrument suite (traffic
  # readers, settings matrix, blind-spot, leak-policy, console series...), and
  # no job ran it — a broken reader could merge green (the #1001 fixture rot
  # was found by hand on a seat, not by CI).
  #
  # TWO steps on purpose: one instrument does not see everything.
  #   - pytest collects the 270 function-style pins (8.5 s measured on a seat);
  #   - 17 files run their checks at MODULE level with their own runner and
  #     define no `test_*` function: pytest imports them (a module-level
  #     failure raises SystemExit -> collection error) but reports 0 tests,
  #     and four of them gate nothing at import time at all
  #     (test_extract_complete, test_lane_out_trend, test_minimax_chain_pairing,
  #     test_turn_autopsy) — only their own runner executes them. So every
  #     file is also run as a script, the semantics the seats use.
  #
  # py7zr is a real dependency of scripts/weekly-drift.py (loaded by its test
  # via importlib), not a convenience install.
  #
  # Mutation AC (issue #1007): reverting the --days filter at
  # scripts/console-tabs.py:382 must turn this job red.
  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install instrument dependencies
        run: python -m pip install --quiet pytest py7zr

      - name: pytest (function-style pins)
        run: python -m pytest scripts/tests -q

      - name: every file by its own runner (module-level pins)
        run: |
          for f in scripts/tests/test_*.py; do
            echo "== $f"
            python "$f" || exit 1
          done

