# Pester suites for the ops scripts (#1058).
#
# The PowerShell ops scripts ship two suites, measured on seats at 17-18 min
# each: `bun run test:scripts` (pwsh 7) and `bun run test:scripts:win51`
# (powershell.exe 5.1 via the hermetic runner, which rebuilds PSModulePath
# user-dir-first so the machine-wide Pester 3.4.0 can never win). The 5.1
# interpreter ships with the OS and runs the scheduled tasks that call these
# scripts, so both lanes must stay green in CI, not just on seats.
#
# Trigger is paths-scoped: scripts/** (which includes scripts/tests/** and
# scripts/lib/**), package.json (the test:scripts* entries live there) and this
# workflow file. A packages/cli-only PR does not pay for a Pester run.
#
# The matrix axis names the INTERPRETER; steps pick their lane via
# `if: matrix.shell == ...` with a LITERAL `shell:` — the matrix context is
# not available in `shell:` itself (GitHub context-availability table), which
# is how the first version of this file failed to compile at all (0s push
# failure, zero jobs, measured 16/11).
#
# NOT a required check yet (#1058 arbitration): it becomes one only after 3
# green runs on main, counted by started_at.
name: Pester scripts

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pester-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pester-scripts.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# WORKFLOW level, deliberately: at job level the two matrix legs would share
# the group and cancel-in-progress would kill the queued sibling leg of the
# SAME run (measured 16/11: powershell leg cancelled at zero steps). Here it
# cancels only the previous run of the same ref, which is the intent.
concurrency:
  group: pester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester-scripts:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v5

      # Seats resolve Pester from their user module dirs (6.2.0 on the 5.1
      # lane); a hosted runner has no such guarantee - pin the same version
      # CurrentUser so both legs run the Pester the suites were written for.
      # Each leg installs under ITS OWN interpreter so the module lands in
      # that interpreter's user dir (Documents\PowerShell\Modules vs
      # Documents\WindowsPowerShell\Modules - the hermetic 5.1 runner rebuilds
      # its path from the latter). -SkipPublisherCheck: Pester ships
      # MS-signed while the gallery package is not.
      - name: Install Pester 6.2.0 (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber
      - name: Install Pester 6.2.0 (powershell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      # #1096: the tests tagged HostBound pass on seats but diverge on hosted
      # runners (seat layout / git setup / hosted-5.1 behavior). The CI legs
      # exclude the tag; seats run everything (package.json is unchanged). The
      # count is printed BEFORE the run so the log states what was excluded and
      # why — never a silent skip.
      - name: Pester suite (pwsh 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $n = (Get-ChildItem -Recurse ./scripts/tests -Filter *.Tests.ps1 | Select-String -Pattern '-Tag HostBound' -SimpleMatch).Count
          Write-Host "HOSTBOUND-EXCLUDED: $n test(s) tagged HostBound skipped on CI (pass on seats; diagnosis: #1096)"
          & ./scripts/tests/run-pester.ps1 -ExcludeTagFilter HostBound
      - name: Pester suite (powershell 5.1, hermetic runner)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $n = (Get-ChildItem -Recurse ./scripts/tests -Filter *.Tests.ps1 | Select-String -Pattern '-Tag HostBound' -SimpleMatch).Count
          Write-Host "HOSTBOUND-EXCLUDED: $n test(s) tagged HostBound skipped on CI (pass on seats; diagnosis: #1096)"
          & ./scripts/tests/run-pester51.ps1 -ExcludeTagFilter HostBound
