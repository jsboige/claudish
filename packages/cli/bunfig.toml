# Sandbox the home directory for every test run started from packages/cli (#242).
[test]
preload = ["./src/test-preload.ts"]
# Same exclusion as the root bunfig (#964): a stale dist/ (128 .test.js) hangs
# the suite under bun 1.3.14 — the compiled channel-wire-format gate spawns a
# POSIX sh shim unresolvable on win32. Pattern matched against full path.
pathIgnorePatterns = ["**/dist/**"]
